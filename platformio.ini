; PlatformIO project for the Waveshare ESP32-S3-Zero
; Emulates a USB HID gamepad: pressing the onboard BOOT button (GPIO0)
; sends an "X button" press to the host PC.

[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1   ; same ESP32-S3 chip/USB wiring as the S3-Zero
framework = arduino
monitor_speed = 115200

; --- Board specifics for the S3-Zero (4MB flash, no PSRAM in use here) ---
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; --- USB configuration ---
; ARDUINO_USB_MODE=0   -> use the native USB-OTG peripheral (TinyUSB) instead
;                         of the USB-Serial/JTAG debug port. Required for HID.
; ARDUINO_USB_CDC_ON_BOOT=0 -> deliberately NOT 1. When it's 1, the Arduino
;                         core's own app_main() calls USB.begin() itself
;                         before setup() ever runs (see CLAUDE.md gotcha),
;                         which is too early for this sketch: it picks which
;                         single HID device to construct, and sets the USB
;                         product name, based on a mode read from NVS in
;                         setup() — both must happen before USB.begin(), so
;                         this sketch must be the one calling it. A manual
;                         USBCDC (`USBSerial` in main.cpp) is begun explicitly
;                         instead, so Serial-style debug output over USB is
;                         still available, just not "on boot".
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
