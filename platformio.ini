; USB/BLE HID latency tester — one firmware, two boards.
;
; Build/flash one variant at a time:
;   pio run -e esp32-s3-zero              pio run -e esp32-s3-zero -t upload
;   pio run -e m5stack-atoms3r            pio run -e m5stack-atoms3r -t upload
;
; A bare `pio run` builds both. The envs differ only in which board_*.cpp
; is compiled (build_src_filter) — src/main.cpp is shared and has no
; board #ifdefs in it.
;
; Do NOT add dependencies with `pio pkg install`: that subcommand rewrites
; this file from its parsed form and drops every comment in it, including
; all of the reasoning below. Edit lib_deps by hand and let `pio run`
; fetch what's missing.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; --- USB configuration (both boards) ---
; ARDUINO_USB_MODE=0   -> use the native USB-OTG peripheral (TinyUSB) instead
;                         of the USB-Serial/JTAG debug port. Required for HID.
; ARDUINO_USB_CDC_ON_BOOT=0 -> deliberately NOT 1. When it's 1, the Arduino
;                         core's own app_main() calls USB.begin() itself
;                         before setup() ever runs (see CLAUDE.md gotcha),
;                         which is too early for this sketch: it picks which
;                         single HID device to construct, and sets the USB
;                         product name, based on a mode read from NVS in
;                         setup() — both must happen before USB.begin(), so
;                         this sketch must be the one calling it. A manual
;                         USBCDC (`USBSerial` in main.cpp) is begun explicitly
;                         instead, so Serial-style debug output over USB is
;                         still available, just not "on boot". It stays 0 in
;                         a BLE mode too, where USB is CDC and nothing else.
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; --- Bluetooth LE (both boards) -----------------------------------------
; The three BLE modes are HID-over-GATT peripherals, built on NimBLE.
; NimBLE rather than the Arduino core's bundled `BLE` library, and the
; choice is not really open: this platform's prebuilt ESP-IDF libraries
; are compiled with CONFIG_BT_NIMBLE_ENABLED=y and CONFIG_BT_BLUEDROID_ENABLED
; unset, so the Bluedroid host that the bundled library — and
; ESP32-BLE-Gamepad/Keyboard/Mouse, which are built on it — needs is not
; in libbt.a at all. See the CLAUDE.md gotcha. NimBLE-Arduino is the
; Arduino-facing wrapper over the host that IS there, and it ships
; NimBLEHIDDevice, which is the whole HoGP service (report map, input
; report, HID info, battery, device info) for the cost of handing it a
; report descriptor.
;
; Linked into both envs unconditionally, because every mode has to be
; reachable from the mode rotation on either board. It costs flash always
; and RAM only in a BLE mode — NimBLEDevice::init() is what starts the
; controller, and main.cpp only calls it in one.
lib_deps =
    h2zero/NimBLE-Arduino@^2.3

; --- Waveshare ESP32-S3-Zero: BOOT button + onboard WS2812 ---------------
[env:esp32-s3-zero]
board = esp32-s3-devkitc-1   ; same ESP32-S3 chip/USB wiring as the S3-Zero
; The devkitc-1 profile hardcodes ARDUINO_USB_MODE=1 in its own extra_flags,
; which would collide with (and redefine) the =0 above. Restate the rest of
; its flags here so that one can be dropped.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
board_upload.flash_size = 4MB
; Still the stock 4MB default.csv, and this was checked rather than
; assumed when the BLE modes landed: the expectation was that a NimBLE
; host plus controller would not fit in default.csv's ~1.25MB OTA slot
; and that this env would need a single-factory-app table of its own, the
; way the AtomS3R has one. It does fit — 684KB, 52% of the slot — so
; there is no table here. The BLE stack is about 500KB of that (the
; controller blob is the bulk of it, plus mbedTLS for pairing), which
; leaves the same kind of headroom the firmware had before. Revisit only
; if the linker actually starts complaining; nvs would have to stay at
; 0x9000 if so, or every device forgets its mode AND its bonds.
board_build.partitions = default.csv
build_src_filter = +<*> -<board_atoms3r.cpp>

; --- M5Stack AtomS3R: screen button + 128x128 LCD -----------------------
; There is no m5stack-atoms3r board in the platform, so the AtomS3 profile
; is used: same ESP32-S3, same 8MB flash, same native-USB wiring. The only
; thing that differs is the panel, and M5GFX autodetects that at runtime.
[env:m5stack-atoms3r]
board = m5stack-atoms3
; The AtomS3 board profile hardcodes ARDUINO_USB_MODE=1 in its own
; extra_flags, which would collide with (and redefine) the =0 above.
; Restate the rest of its flags here so that one can be dropped.
board_build.extra_flags =
    -DARDUINO_M5Stack_ATOMS3
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_src_filter = +<*> -<board_s3zero.cpp>
; Custom partition table, replacing the AtomS3 profile's default_8MB.csv.
; The automated test writes each run out as a CSV file, and those files
; have to sit on a real FAT volume because USB drive mode exposes this
; partition raw over USB MSC — the stock table has a SPIFFS partition
; instead, so it can't be used as-is. nvs is left at exactly the offset
; and size the stock table gives it, so reflashing an existing device
; doesn't reset its persisted mode. See the CSV itself for the rest of
; the reasoning. The 4MB factory app it already had absorbed the BLE
; stack here with nothing to change — which is what that table's comment
; said it was sized for.
board_build.partitions = partitions_atoms3r_8MB.csv
; M5GFX drives the panel (GC9107 or ST7735S depending on batch) and the
; LP5562 the AtomS3R puts in front of the backlight. M5GFX_BOARD skips
; the probe-every-known-board autodetect and goes straight to this one.
build_flags =
    ${env.build_flags}
    -DM5GFX_BOARD=board_M5AtomS3R
lib_deps =
    ${env.lib_deps}
    m5stack/M5GFX@^0.2.14
